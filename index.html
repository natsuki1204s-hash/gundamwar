<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ガンダムウォー卓</title>
<style>
:root{
  --bg:#14161b; --panel:#1c1f26; --panel2:#242832; --line:#323743; --text:#e7e9ee; --sub:#9aa1b0; --accent:#e0b14a; --danger:#e0645a; --ok:#5cc58a;
  --c-白:#e9e6dc; --c-青:#3a7be0; --c-緑:#33a85a; --c-黒:#55555f; --c-赤:#d9483d; --c-茶:#a87240; --c-紫:#8a58c4; --c-無:#9a9a9a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button:hover{border-color:#4a5162}
button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
input,select,textarea{background:#11131a;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #4b6fb3;outline-offset:-1px}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:#101217;height:48px}
header h1{font-size:16px;margin:0;letter-spacing:.05em}
header h1 span{color:var(--accent)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:transparent;border-color:transparent}
nav.tabs button.on{border-color:var(--line);background:var(--panel2)}
main{height:calc(100% - 48px)}
.view{display:none;height:100%}
.view.on{display:flex}

/* ===== デッキ構築 ===== */
#builder{gap:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
#searchPane{flex:1 1 60%;border-right:1px solid var(--line)}
#deckPane{flex:1 1 40%;max-width:520px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row input[type=search]{flex:1 1 200px}
.chip{border-radius:999px;padding:2px 10px;font-size:13px;background:transparent;opacity:.55}
.chip.on{opacity:1;background:var(--panel2);border-color:#5a6275}
.chip .dot,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid #0006}
.cost-in{width:52px}
.count{color:var(--sub);font-size:12px;text-align:right;margin-top:-4px}
.list{flex:1;overflow:auto;padding:4px 0}
.crow{display:grid;grid-template-columns:6px 1fr auto;gap:0 10px;padding:6px 12px 6px 0;border-bottom:1px solid #262a33;cursor:pointer}
.crow:hover{background:#1f232b}
.crow .bar{grid-row:1/3;border-radius:0 3px 3px 0}
.crow .bar{grid-column:1}
.crow .nm{grid-column:2;grid-row:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .meta{grid-column:2;grid-row:2;min-width:0;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .act{grid-column:3;grid-row:1/3;display:flex;align-items:center;gap:4px}
.crow .act button{width:30px;height:30px;padding:0;font-size:16px;line-height:1}
.crow .have{min-width:18px;text-align:center;color:var(--accent);font-weight:700}
.more{display:block;margin:10px auto}
.tbadge{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;background:#2d3240;color:#c9cfdb;margin-right:6px;vertical-align:1px}

.deckhead{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.deckhead .row select{flex:1}
#deckName{flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.stats b{color:var(--text);font-size:15px}
.stats .bad{color:var(--danger)}
.colorbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#2a2e38}
.dsec{padding:6px 12px 2px;font-size:12px;color:var(--sub);border-bottom:1px solid #262a33;background:#191c22;position:sticky;top:0}
.empty{padding:30px 16px;color:var(--sub);text-align:center}

/* ===== カード表示（画像がない時のカード風の枠） ===== */
.card{width:250px;aspect-ratio:63/88;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,var(--cc) 0%,#15171c 85%);border:2px solid #0008;box-shadow:0 4px 16px #0007;color:#f3f3f3;font-size:11.5px;position:relative;overflow:hidden;flex:none}
.card.img{padding:0;background:#000}
.card.img img{width:100%;height:100%;object-fit:cover;display:block}
.card .top{display:flex;align-items:center;gap:6px}
.card .cost{background:#000a;border-radius:4px;padding:1px 5px;font-weight:700;font-size:12px;white-space:nowrap}
.card .name{font-weight:700;font-size:13px;line-height:1.25;text-shadow:0 1px 2px #000}
.card .model{font-size:10px;opacity:.85}
.card .art{flex:0 0 28%;border-radius:6px;background:repeating-linear-gradient(45deg,#0003 0 6px,#0001 6px 12px);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;opacity:.75;letter-spacing:.05em}
.card .traits{font-size:10.5px;background:#0006;border-radius:4px;padding:1px 5px}
.card .text{flex:1;overflow:auto;background:#0008;border-radius:6px;padding:5px 6px;line-height:1.45}
.card .text p{margin:0 0 3px}
.card .vtop{background:#2a1f3df0;border:1px solid #c9a8ff;border-radius:6px;padding:3px 6px;font-size:11.5px;line-height:1.35}
.card .vtop .sub{display:block;font-weight:800;background:none;max-width:none;white-space:normal;font-size:inherit;padding:0;cursor:auto;opacity:1}
.card .vtop>b{color:#d9c2ff}
.card .vtop p{margin:0}
.card.v .foot,.card.v .text{opacity:.45}
.card.img .vtop{position:absolute;left:6px;right:6px;top:6px}
.card.sm .vtop{display:none}
.card .text .alt{border-top:1px dashed #fff6;margin-top:4px;padding-top:3px}
.card .text .alt .sub{font-weight:bold;opacity:.85;background:none;max-width:none;white-space:normal;font-size:inherit;padding:0;cursor:auto}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.card .st{font-weight:800;font-size:14px;background:#000a;border-radius:4px;padding:0 6px;letter-spacing:.05em}
.card[data-c="白"] .name,.card[data-c="白"] .model{color:#1b1b1f;text-shadow:none}
.card[data-c="白"] .art{color:#333}
.card.sm{width:120px;font-size:8px;padding:5px;gap:3px;border-radius:7px}
.card.sm .name{font-size:10px}.card.sm .cost{font-size:9px}.card.sm .st{font-size:11px}.card.sm .text{display:none}.card.sm .model,.card.sm .traits{display:none}.card.sm .art{flex:1;font-size:20px}
.kw{color:#ffd77a}

/* ===== 詳細シート ===== */
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#sheet.on{display:flex}
.sheet-in{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;gap:16px}
.sheet-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sheet-info h2{margin:0;font-size:18px}
.sheet-info .sub{color:var(--sub);font-size:12px}
.sheet-info .txt{background:#11131a;border-radius:8px;padding:8px 10px;line-height:1.6}
.sheet-info .txt p{margin:0 0 4px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:40px;height:40px;font-size:20px;padding:0}
.qty b{font-size:20px;min-width:24px;text-align:center}

/* ===== モーダル共通 ===== */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:560px;width:calc(100% - 32px);padding:16px}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 8px}
dialog textarea{width:100%;height:220px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
dialog .row{justify-content:flex-end;margin-top:10px}
.note{color:var(--sub);font-size:12px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}


/* ===== スマホ ===== */
.mobbar,.mobonly{display:none}
.fmore{display:flex;flex-direction:column;gap:8px}
@media (max-width:820px){
  header{padding:8px 12px}
  #builder{flex-direction:column}
  #searchPane,#deckPane{flex:1;max-width:none;border:0}
  #builder:not(.showdeck) #deckPane{display:none}
  #builder.showdeck #searchPane{display:none}
  .mobonly{display:inline-block}
  .row input[type=search]{flex:1 1 100px}
  #sort{width:96px}
  .fmore{display:none}
  .filters.open .fmore{display:flex}
  .filters{padding:8px 12px}
  .mobbar{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#101217}
  .mobbar button{flex:1;padding:10px}
  .mobbar button.on{border-color:var(--accent);color:var(--accent)}
  .crow .act .pc{display:none}
  .sheet-in{flex-direction:column;align-items:center;padding:12px}
  #sheet{align-items:flex-end;padding:0}
  .sheet-in{border-radius:12px 12px 0 0;max-height:92%}
  .sheet-in .card{width:170px}
  nav.tabs button{padding:5px 8px}
}
</style>

<body>
<header>
  <h1>GUNDAM WAR <span>卓</span></h1>
  <nav class="tabs">
    <button data-view="builder" class="on">デッキ構築</button>
    <button data-view="battle">対戦</button>
  </nav>
</header>
<main>
  <!-- ===== デッキ構築 ===== -->
  <section id="builder" class="view on">
    <div class="pane" id="searchPane">
      <div class="filters">
        <div class="row">
          <input type="search" id="q" placeholder="カード名・テキスト・特徴で検索（スペースで絞り込み）">
          <select id="sort">

        <div class="row" id="typeChips"></div>
        <div class="row">
          <span class="note">合計国力</span>
          <input type="number" id="costMin" class="cost-in" min="0" placeholder="下限">
          <span class="note">〜</span>
          <input type="number" id="costMax" class="cost-in" min="0" placeholder="上限">
          <select id="setSel" style="flex:1 1 160px"><option value="">全セット</option></select>
        </div>
        </div>
        <span class="count" id="hitCount"></span>
      </div>
      <div class="list" id="results"></div>

    <div class="pane" id="deckPane">

        <div class="row">

    <div class="mobbar">
      <button id="mSearch" class="on">カード検索</button>
      <button id="mDeck">デッキ <span id="mCount">0</span>枚</button>
    </div>
  </section>

  <!-- ===== 対戦（中身は battle.js が作る） ===== -->

</main>

<div id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

<dialog id="codeDlg">
  <h3 id="codeTitle"></h3>
  <p class="note" id="codeNote"></p>
  <textarea id="codeText" spellcheck="false"></textarea>
  <div class="row">
    <button id="codeCopy">コピー</button>
    <button id="codeOk" class="primary">閉じる</button>
  </div>
</dialog>

<dialog id="ruleDlg">
  <h3>ルール設定</h3>
  <p class="note">デッキの枚数チェックに使います。身内ルールに合わせて変えてください。</p>
  <p class="note">初期値は公式ルール：ちょうど50枚／G以外の同名カードは3枚まで（ユニットは型番込みの名称で判定）／基本Gは無制限／特殊Gは合計6枚まで</p>
  <div class="row" style="justify-content:flex-start">デッキ枚数（ちょうど） <input type="number" id="ruleSize" style="width:80px"></div>
  <div class="row" style="justify-content:flex-start">同名カードの上限 <input type="number" id="ruleCopies" style="width:80px"></div>
  <div class="row" style="justify-content:flex-start">特殊Gの合計上限 <input type="number" id="ruleSG" style="width:80px"></div>
  <div class="row"><button id="ruleReset" class="ghost">公式ルールに戻す</button><button id="ruleOk" class="primary">保存</button></div>
</dialog>

<div id="toast"></div>
<input type="file" id="imgFile" accept="image/*" hidden>

<script src="cards.js?v=20261113c"></script>
<script src="shared.js?v=20261113b"></script>
<script>
'use strict';
// =====================================================================
//  データ
// =====================================================================
const CARDS = window.GW_CARDS || [];
// 基本G（Wikiにページがないのでここで用意する。何枚でも入れられる）
if (CARDS.length) ['白','青','緑','黒','赤','茶','紫'].reverse().forEach(c => CARDS.unshift({
  id: 'BASIC|' + c, n: `基本G（${c}）`, t: 'G', c, k: [null, null, null], r: '', basic: true, gp: [c, 1, ''],
  x: [`(自動A):このカードは、${c}国力1を発生する。`], no: ['基本G'], s: ['基本G']
}));
const BY_ID = new Map(CARDS.map(c => [c.id, c]));
const COLORS = ['白','青','緑','黒','赤','茶','紫','無'];
const TYPES = [['U','ユニット'],['CH','キャラクター'],['C','コマンド'],['O','オペレーション'],['G','G'],['A','ACE']];
const TYPE_NAME = Object.fromEntries(TYPES);
const TYPE_ORDER = Object.fromEntries(TYPES.map((t,i)=>[t[0],i]));

const kata = s => s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
const norm = s => kata((s||'').normalize('NFKC').toLowerCase());
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const total = c => c.k && c.k[1] != null ? +c.k[1] : -1;
// デュアルカード（2色の指定国力）は c.d = ['赤', 1]。「黒2赤1-4-0」と出す。ダブルオーの「紫 2-2-4-1」は c.d = ['任意', 2] で「紫2任意2-4-1」（2つ目は何色でもいい）
const costStr = c => c.k && c.k[0] != null ? (c.d ? `${c.c}${c.k[0]}${c.d[0]}${c.d[1]}-${c.k[1]}-${c.k[2]}` : c.k.join('-')) : '';
const altHtml = c => c.alt ? `<div class="sub">${esc(c.alt.name || '別形態')}　${esc((c.alt.tags || []).join(' '))} [${esc((c.alt.stats || []).join(']['))}]</div>${(c.alt.text || []).map(t => `<p>${fmtText(t)}</p>`).join('')}` : '';
const numKey = no => { const m = /^([A-Z]+)-([A-Z]?)(\d+)/.exec(no || ''); return m ? [m[1], m[2], +m[3]] : [no, '', 0]; };
CARDS.forEach(c => {
  c._q = norm([c.n, c.m, (c.x||[]).join(' '), (c.tr||[]).join(' '), (c.tg||[]).join(' '), (c.no||[]).join(' '), c.alt ? c.alt.name : ''].join(' '));
  c._nk = numKey(c.no[0]);
});

// =====================================================================
//  保存まわり（ブラウザ内）
// =====================================================================
const store = {
  get(k, d) { try { const v = localStorage.getItem('gw.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gw.' + k, JSON.stringify(v)); } catch (e) { toast('保存できませんでした（ブラウザの設定を確認）'); } }
};
// デッキ構築ルール（Wikiより）：ちょうど50枚／G以外の同名は3枚まで（ユニットは型番込みの名称）／基本Gは無制限／特殊Gは合計6枚まで
const RULE_DEFAULT = { size: 50, copies: 3, specialG: 6 };
let rules = Object.assign({}, RULE_DEFAULT, store.get('rules2', {}));
let decks = store.get('decks', []);
let curId = store.get('cur', null);
if (!decks.length) decks = [newDeckObj('新しいデッキ')];
if (!decks.find(d => d.id === curId)) curId = decks[0].id;
function newDeckObj(name) { return { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, cards: {}, updated: Date.now() }; }
const cur = () => decks.find(d => d.id === curId);
function saveDecks() { cur().updated = Date.now(); store.set('decks', decks); store.set('cur', curId); }

// =====================================================================
//  画像
//  優先順位：① このブラウザで設定した画像（IndexedDB の img）
//            ② みんなの画像（shared.js の Firebase に誰かが入れた物。IndexedDB の shared に写しを持つ）
//            ③ サイトの images/ フォルダ（images/index.json に載っているもの）
//            ④ なければカード風の枠
//  みんなの画像は Firestore の images コレクションに1カード名1文書 {k: カード名, d: JPEG の base64, t: 入れた時刻ms}。
//  消す時は d を '' にして残す（他の人のブラウザの写しも消えるように）。SDK は使わず REST で読み書きする。
//  起動時と3分ごと（画面が見えている間）に、前回より新しい t の物だけ取りに行く。
// =====================================================================
const Images = (() => {
  let db = null;
  const local = new Map(), shared = new Map(), site = new Map();
  const SH = window.GW_SHARED || {};
  const on = !!(SH.projectId && SH.apiKey);
  const base = on ? `https://firestore.googleapis.com/v1/projects/${SH.projectId}/databases/(default)/documents` : '';
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open('gw-images', 2);
      r.onupgradeneeded = () => {
        if (!r.result.objectStoreNames.contains('img')) r.result.createObjectStore('img');
        if (!r.result.objectStoreNames.contains('shared')) r.result.createObjectStore('shared');
      };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
  const each = (store, fn) => new Promise(res => {
    const req = db.transaction(store).objectStore(store).openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { fn(c.key, c.value); c.continue(); } else res(); };
    req.onerror = () => res();
  });
  const idbPut = (store, key, v) => new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(v, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  const idbDel = (store, key) => new Promise(res => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = res; tx.onerror = res; });
  const setUrl = (m, key, blob) => { if (m.has(key)) URL.revokeObjectURL(m.get(key)); if (blob) m.set(key, URL.createObjectURL(blob)); else m.delete(key); };

  async function init() {
    await open();
    if (db) {
      await each('img', (k, v) => local.set(k, URL.createObjectURL(v)));
      await each('shared', (k, v) => v && v.b && shared.set(k, URL.createObjectURL(v.b)));
    }
    if (location.protocol !== 'file:') try {   // images/index.json の形式：{"U-159": "U-159.jpg", "ザクII(スレンダー機)": "zaku_slender.jpg", ...}
      const r = await fetch('images/index.json', { cache: 'no-cache' });
      if (r.ok) Object.entries(await r.json()).forEach(([k, f]) => site.set(k, 'images/' + f));
    } catch (e) {}
    if (on) {
      sync();
      setInterval(() => { if (!document.hidden) sync(); }, 180000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastTry > 60000) sync(); });
    }
  }

  // ---- みんなの画像（Firestore REST）----
  let lastTry = 0, syncing = false;
  const LAST = 'gw-shared-last';
  const docId = k => [...new TextEncoder().encode(k)].map(b => b.toString(16).padStart(2, '0')).join('');
  const b64ToBlob = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: 'image/jpeg' }); };
  const blobToB64 = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(b); });
  async function sync() {
    if (!on || syncing || !db) return;
    syncing = true; lastTry = Date.now();
    let changed = 0;
    try {
      let last = +(localStorage.getItem(LAST) || 0);
      for (let page = 0; page < 50; page++) {
        const r = await fetch(`${base}:runQuery?key=${SH.apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ structuredQuery: {
            from: [{ collectionId: 'images' }],
            where: { fieldFilter: { field: { fieldPath: 't' }, op: 'GREATER_THAN', value: { integerValue: String(last) } } },
            orderBy: [{ field: { fieldPath: 't' }, direction: 'ASCENDING' }],
            limit: 40,
          } }),
        });
        if (!r.ok) throw new Error('runQuery ' + r.status);
        const docs = (await r.json()).filter(x => x.document).map(x => x.document.fields);
        for (const f of docs) {
          const k = f.k?.stringValue, d = f.d?.stringValue || '', t = +(f.t?.integerValue || 0);
          if (!k) continue;
          if (d) { const b = b64ToBlob(d); await idbPut('shared', k, { b, t }); setUrl(shared, k, b); }
          else { await idbDel('shared', k); setUrl(shared, k, null); }
          if (t > last) last = t;
          changed++;
        }
        localStorage.setItem(LAST, String(last));
        if (docs.length < 40) break;
      }
    } catch (e) { console.warn('みんなの画像を読めませんでした', e); }
    syncing = false;
    if (changed) window.dispatchEvent(new Event('gw-images'));
  }
  async function putShared(key, blob) {
    if (!on) throw new Error('共有の設定がありません');
    const t = Date.now();
    const d = blob ? await blobToB64(blob) : '';
    const r = await fetch(`${base}/images/${docId(key)}?key=${SH.apiKey}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { k: { stringValue: key }, d: { stringValue: d }, t: { integerValue: String(t) } } }),
    });
    if (!r.ok) throw new Error('共有に送れませんでした（' + r.status + '）');
    if (db) { if (blob) await idbPut('shared', key, { b: blob, t }); else await idbDel('shared', key); }
    setUrl(shared, key, blob);
  }

  // 収録番号ごと → カード名 の順に探す（同名で絵が同じなら名前で1枚登録すれば済む）
  function url(c) {
    for (const k of [c.id, ...c.no, c.n]) { if (local.has(k)) return local.get(k); if (shared.has(k)) return shared.get(k); if (site.has(k)) return site.get(k); }
    return null;
  }
  async function put(key, blob) {
    if (!db) throw new Error('この環境では画像を保存できません');
    await idbPut('img', key, blob);
    setUrl(local, key, blob);
  }
  async function del(key) {
    if (!db) return;
    await idbDel('img', key);
    setUrl(local, key, null);
  }
  const hasLocal = c => local.has(c.n);
  const hasShared = c => shared.has(c.n);
  return { init, url, put, del, hasLocal, hasShared, putShared, sync, get shareOn() { return on; } };
})();

// 長辺 max px に縮めて JPEG に（容量節約）。みんなの画像は 1文書1MB までなので小さめにする
async function shrink(file, max = 800, q = 0.85) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
}

function filtered() {
  const words = norm(F.q).split(/\s+/).filter(Boolean);
  let r = CARDS.filter(c =>
    (!F.colors.size || F.colors.has(c.c) || (c.d && F.colors.has(c.d[0]))) &&
    (!F.types.size || F.types.has(c.t)) &&
    (F.cmin == null || total(c) >= F.cmin) &&
    (F.cmax == null || (total(c) >= 0 && total(c) <= F.cmax)) &&
    (!F.set || c.s.includes(F.set)) &&
    words.every(w => c._q.includes(w)));
  const byNo = (a, b) => a._nk[0] < b._nk[0] ? -1 : a._nk[0] > b._nk[0] ? 1 : a._nk[1] < b._nk[1] ? -1 : a._nk[1] > b._nk[1] ? 1 : a._nk[2] - b._nk[2];
  const nameHit = c => words.length && words.every(w => norm(c.n).includes(w)) ? 0 : 1;
  if (F.sort === 'name') r.sort((a, b) => nameHit(a) - nameHit(b) || a.n.localeCompare(b.n, 'ja') || byNo(a, b));
  else if (F.sort === 'cost') r.sort((a, b) => nameHit(a) - nameHit(b) || total(a) - total(b) || byNo(a, b));

}

// 同名判定に使う名前（ユニットは「型番を含む名称」）。Gは同名制限の対象外なので null
const sameKey = c => c.t === 'G' ? null : c.t === 'U' ? (c.m || '') + ' ' + c.n : c.n;
const isSpecialG = c => c.t === 'G' && !c.basic;
const countWhere = (deck, f) => Object.entries(deck.cards).reduce((s, [id, n]) => { const c = BY_ID.get(id); return s + (c && f(c) ? n : 0); }, 0);
function addCard(id, delta) {
  const d = cur(), c = BY_ID.get(id); if (!c) return;
  const now = d.cards[id] || 0;
  if (delta > 0) {
    const k = sameKey(c);
    if (k && rules.copies > 0 && countWhere(d, x => sameKey(x) === k) >= rules.copies) { toast(`同名カードは${rules.copies}枚までです`); return; }
    if (isSpecialG(c) && rules.specialG > 0 && countWhere(d, isSpecialG) >= rules.specialG) { toast(`特殊Gは合計${rules.specialG}枚までです`); return; }
  }
  const n = Math.max(0, now + delta);
  if (n) d.cards[id] = n; else delete d.cards[id];
  saveDecks(); renderAll(true);
}
function listClick(e) {

function deckEntries(d) {

function renderDeck() {

  // 集計

  const sg = countWhere(d, isSpecialG), bg = countWhere(d, c => c.basic);

  const byKey = {}; ents.forEach(([c, k]) => { const key = sameKey(c); if (key) byKey[key] = (byKey[key] || 0) + k; });
  Object.entries(byKey).forEach(([key, k]) => { if (rules.copies && k > rules.copies) over.add(key); });
  $('deckStats').innerHTML =

    (over.size ? `<span class="bad">同名${rules.copies}枚超え：${esc([...over].join('、'))}</span>` : '') +
    (n === rules.size && !over.size && sg <= rules.specialG && !missing ? '<span style="color:var(--ok)">✓ 構築OK</span>' : '') +
    TYPES.filter(([t]) => byType[t]).map(([t, l]) => `<span>${l} <b>${byType[t]}</b></span>`).join('') +

// =====================================================================
function deckToText(d) {
  const ents = deckEntries(d).sort((a, b) => TYPE_ORDER[a[0].t] - TYPE_ORDER[b[0].t] || total(a[0]) - total(b[0]));
  return `# ${d.name}\n` + ents.map(([c, k]) => c.basic ? `${k} ${c.n}` : `${k} ${c.n} [${c.no[0]}]`).join('\n');
}
function textToDeck(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let name = '読み込んだデッキ'; const cards = {}, ng = [];
  for (const l of lines) {
    if (l.startsWith('#')) { name = l.replace(/^#+\s*/, '') || name; continue; }
    const m = /^(\d+)\s*[x×枚]?\s*(.+?)\s*(?:\[([^\]]+)\])?$/.exec(l.normalize('NFKC'));
    if (!m) { ng.push(l); continue; }
    const [, k, nm, no] = m;
    const nn = norm(nm);
    const bm = /基本G|基本g/.test(nm) && /[白青緑黒赤茶紫]/.exec(nm);
    if (bm) { const id = 'BASIC|' + bm[0]; cards[id] = (cards[id] || 0) + +k; continue; }
    let c = no && CARDS.find(c => c.no.includes(no) && norm(c.n) === nn);
    if (!c && no) c = CARDS.find(c => c.no.includes(no));
    if (!c) c = CARDS.find(c => norm(c.n) === nn);
    if (!c) { ng.push(l); continue; }
    cards[c.id] = (cards[c.id] || 0) + +k;
  }
  return { name, cards, ng };
}

        ${Images.shareOn && Images.hasLocal(c) ? '<button id="imgUp" class="ghost" title="このブラウザだけの画像を、みんなの画像にします">みんなに出す</button>' : ''}
        ${Images.hasShared(c) ? '<button id="imgDelS" class="ghost">みんなの画像を外す</button>' : ''}
        <button id="sheetClose" class="primary" style="margin-left:auto">閉じる</button>
      </div>
      <div class="note">${Images.shareOn
        ? '入れた画像は<b>みんなの画像</b>になり、サイトを開いた全員に見えます（同じ名前のカード共通。数分で届きます）。自分のブラウザだけの画像がある時はそちらが先に出ます。'
        : '画像はこのブラウザにだけ保存され、同じ名前のカードに共通で使われます。'}サイトの画像を右クリック→「画像をコピー」してから、この画面で Ctrl+V（または「クリップボードから貼る」）でも入れられます。
        ${Images.shareOn && Images.hasLocal(c) ? '<br><a href="#" id="imgUpAll">このブラウザだけの画像を全部みんなに出す</a>' : ''}</div>
    </div>`;
  $('sheet').classList.add('on');
}
function closeSheet() { $('sheet').classList.remove('on'); sheetId = null; }
$('sheet').onclick = async e => {
  if (e.target.id === 'sheet' || e.target.id === 'sheetClose') { closeSheet(); return; }
  const q = e.target.closest('[data-q]'); if (q) { addCard(sheetId, +q.dataset.q); return; }
  if (e.target.id === 'imgSet') $('imgFile').click();
  if (e.target.id === 'imgPaste') {
    try {
      if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('read なし');
      for (const it of await navigator.clipboard.read()) {
        const ty = it.types.find(t => t.startsWith('image/'));
        if (ty) { await setImage(await it.getType(ty)); return; }
      }
      toast('クリップボードに画像がありません（画像を右クリック→「画像をコピー」してから）');
    } catch (err) { toast('このブラウザでは読めませんでした。この画面で Ctrl+V を押して貼ってください'); }
  }
  if (e.target.id === 'imgDel') { await Images.del(BY_ID.get(sheetId).n); renderAll(true); toast('画像を外しました'); }
  if (e.target.id === 'imgDelS') {
    try { await Images.putShared(BY_ID.get(sheetId).n, null); renderAll(true); toast('みんなの画像を外しました'); } catch (err) { toast(err.message); }
  }
  if (e.target.id === 'imgUp') {
    const n = BY_ID.get(sheetId).n;
    try { await Images.putShared(n, await shrink(await (await fetch(Images.url({ id: '', no: [], n }))).blob(), 600, 0.8)); await Images.del(n); renderAll(true); toast('みんなの画像にしました'); } catch (err) { toast(err.message); }
  }
  if (e.target.id === 'imgUpAll') { e.preventDefault(); upAllLocal(); }
};
async function setImage(f) {
  if (!f || !sheetId) return;
  const n = BY_ID.get(sheetId).n;
  if (Images.shareOn) {
    // みんなの画像に入れる。自分だけの画像が残っているとそちらが先に出るので外す
    try { await Images.putShared(n, await shrink(f, 600, 0.8)); if (Images.hasLocal({ n })) await Images.del(n); renderAll(true); toast('みんなの画像にしました'); }
    catch (err) { toast(err.message || '画像を送れませんでした'); }
    return;
  }
  try { await Images.put(n, await shrink(f)); renderAll(true); toast('画像を設定しました'); }
  catch (err) { toast('画像を保存できませんでした'); }
}
// このブラウザだけの画像（カード名で入れた物）を全部みんなの画像に移す
async function upAllLocal() {
  const names = [...new Set(CARDS.map(c => c.n))].filter(n => Images.hasLocal({ n }));
  if (!names.length) { toast('このブラウザだけの画像はありません'); return; }
  if (!confirm(`このブラウザだけの画像 ${names.length}枚を、みんなの画像に出します。よろしいですか？`)) return;
  let ok = 0;
  for (const n of names) {
    try {
      const b = await (await fetch(Images.url({ id: '', no: [], n }))).blob();
      await Images.putShared(n, await shrink(b, 600, 0.8)); await Images.del(n); ok++;
      toast(`みんなに出しています… ${ok}/${names.length}`);
    } catch (err) { console.warn(n, err); }
  }
  renderAll(true); toast(`${ok}枚をみんなの画像にしました` + (ok < names.length ? `（${names.length - ok}枚は失敗）` : ''));
}
window.addEventListener('gw-images', () => renderAll(true));
$('imgFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; setImage(f); };
// カードの詳細を開いている間の Ctrl+V：クリップボードの画像をそのカードの画像にする
document.addEventListener('paste', e => {
  if (!sheetId || !$('sheet').classList.contains('on')) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const it = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!it) { toast('クリップボードに画像がありません'); return; }
  e.preventDefault(); setImage(it.getAsFile());
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// =====================================================================
//  画面切り替え
// =====================================================================
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === b.dataset.view));
});
$('mSearch').onclick = () => { $('builder').classList.remove('showdeck'); $('mSearch').classList.add('on'); $('mDeck').classList.remove('on'); };
$('mDeck').onclick = () => { $('builder').classList.add('showdeck'); $('mDeck').classList.add('on'); $('mSearch').classList.remove('on'); };

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

// 起動
if (!CARDS.length) document.body.innerHTML = '<p style="padding:20px">cards.js が読み込めませんでした。index.html と同じフォルダに置いてください。</p>';
else { renderAll(); Images.init().then(() => renderAll()); }
</script>
